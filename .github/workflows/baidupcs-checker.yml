name: BaiduPCS Update Checker

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: baidupcs-checker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      changed: ${{ steps.cache.outputs.cache-hit != 'true' }}
    steps:
      - name: Get latest release tag
        id: release
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.getLatestRelease({
              owner: 'qjfoidnh', repo: 'BaiduPCS-Go'
            });
            if (!/^v?\d+\.\d+\.\d+$/.test(data.tag_name)) {
              throw new Error('Unexpected upstream release tag');
            }
            core.setOutput('tag', data.tag_name);
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: /tmp/baidupcs-release
          key: baidupcs-multiplatform-${{ steps.release.outputs.tag }}
          lookup-only: true

  build:
    needs: check
    if: needs.check.outputs.changed == 'true'
    uses: ./.github/workflows/baidupcs-builder.yml
    with:
      tag: ${{ needs.check.outputs.tag }}

  record:
    needs: [check, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record successful publication
        env:
          RELEASE_TAG: ${{ needs.check.outputs.tag }}
        run: printf '%s\n' "$RELEASE_TAG" > /tmp/baidupcs-release
      - uses: actions/cache/save@v4
        with:
          path: /tmp/baidupcs-release
          key: baidupcs-multiplatform-${{ needs.check.outputs.tag }}
