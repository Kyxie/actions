name: Securo Builder

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Stable upstream release tag (for example, v0.21.0)"
        required: true
        type: string

concurrency:
  group: securo-builder
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Context
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate release tag
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'ERROR: Expected a stable Securo release tag' >&2
            exit 1
          fi
          echo "upstream=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check published image
        id: image
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          image="ghcr.io/kyxie/securo:$RELEASE_TAG"
          if result=$(docker buildx imagetools inspect "$image" 2>&1); then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
            printf '%s\n' "$result"
          fi

      - name: Build image for smoke test
        if: steps.image.outputs.exists == 'false'
        uses: docker/build-push-action@v5
        with:
          context: securo
          load: true
          tags: securo:smoke
          platforms: linux/amd64
          cache-from: type=gha,scope=securo
          build-args: SECURO_VERSION=${{ steps.version.outputs.upstream }}

      - name: Check migrations, API, and frontend
        if: steps.image.outputs.exists == 'false'
        working-directory: securo
        run: |
          compose=(docker compose -f smoke.compose.yml)
          trap '"${compose[@]}" down -v' EXIT
          "${compose[@]}" up -d --wait --wait-timeout 90 postgres redis
          "${compose[@]}" exec -T postgres psql -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE securo LOGIN PASSWORD 'smoke-test';
          CREATE DATABASE securo OWNER securo;
          \connect securo
          CREATE EXTENSION vector;
          SQL
          if ! "${compose[@]}" up -d --wait --wait-timeout 150 server; then
            "${compose[@]}" logs server
            exit 1
          fi
          "${compose[@]}" exec -T server python - <<'PY'
          from html.parser import HTMLParser
          from urllib.parse import urljoin, urlsplit
          from urllib.request import urlopen

          class Assets(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.scripts = []

              def handle_starttag(self, tag, attrs):
                  src = dict(attrs).get("src", "")
                  address = urlsplit(src)
                  if tag == "script" and not address.scheme and not address.netloc and address.path.endswith(".js"):
                      self.scripts.append(src)

          origin = "http://127.0.0.1:8000"
          with urlopen(origin + "/", timeout=5) as response:
              assert response.headers.get_content_type() == "text/html"
              assets = Assets()
              assets.feed(response.read().decode())
          assert assets.scripts, "No built JavaScript entrypoint found in the homepage"
          for asset in assets.scripts:
              with urlopen(urljoin(origin, asset), timeout=5) as response:
                  assert "javascript" in response.headers.get_content_type()
                  assert response.read(1), f"Empty asset: {asset}"
          PY

      - name: Publish amd64 and arm64 image
        if: steps.image.outputs.exists == 'false'
        uses: docker/build-push-action@v5
        with:
          context: securo
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/kyxie/securo:${{ inputs.tag }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=securo
          cache-to: type=gha,mode=max,scope=securo
          build-args: SECURO_VERSION=${{ steps.version.outputs.upstream }}
