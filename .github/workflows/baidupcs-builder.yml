name: BaiduPCS Builder

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Build image"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Context
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: baidupcs/Dockerfile
          push: true
          cache-from: type=gha,scope=baidupcs
          cache-to: type=gha,mode=max,scope=baidupcs
          build-args: |
            BPCS_VER=${{ inputs.tag }}
          tags: |
            ghcr.io/kyxie/baidupcs-go:${{ inputs.tag }}
            ghcr.io/kyxie/baidupcs-go:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
