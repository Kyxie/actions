name: BaiduPCS Builder

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Build image"
        required: true
        type: string

concurrency:
  group: baidupcs-builder
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Context
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'ERROR: Expected a stable upstream release tag' >&2
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: baidupcs/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha,scope=baidupcs
          cache-to: type=gha,mode=max,scope=baidupcs
          build-args: |
            BPCS_VER=${{ inputs.tag }}
          tags: |
            ghcr.io/kyxie/baidupcs-go:${{ inputs.tag }}
            ghcr.io/kyxie/baidupcs-go:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
