name: PostgreSQL Extension Image Builder

on:
  workflow_dispatch:

concurrency:
  group: postgres-builder
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/kyxie/postgres
      IMAGE_TAG: 17.11-alpine3.24-pgvector0.8.7

    steps:
      - name: Checkout Context
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish amd64 and arm64 image
        uses: docker/build-push-action@v5
        with:
          context: postgres
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=postgres-extensions
          cache-to: type=gha,mode=max,scope=postgres-extensions
